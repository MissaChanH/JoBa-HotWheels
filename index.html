<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06101d">
<title>Feliz día de los Hot Wheels 🏎️💙</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#030912;color:#fff}
body{font-family:Georgia,"Times New Roman",serif;overflow-x:hidden}
.page{width:100%;max-width:900px;margin:auto;position:relative}
.art{display:block;width:100%;height:auto}
.hotspot{position:absolute;display:block;text-decoration:none}
#start{left:27%;top:8.2%;width:46%;height:4.5%}
#km1{left:0;top:20%;width:100%;height:11%}
#km2{left:0;top:31%;width:100%;height:11%}
#km3{left:0;top:42%;width:100%;height:11%}
#stop{left:75%;top:51%;width:24%;height:5%}
#gift{left:50%;top:60%;width:48%;height:15%;transform:translateX(-50%)}
#final{left:50%;top:91%;width:52%;height:5%;transform:translateX(-50%)}
.cover{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.petal{position:absolute;width:10px;height:5px;background:#68d8ff;border-radius:100% 0 100% 0;opacity:.8;animation:float linear infinite}
.p1{left:8%;top:14%;animation-duration:8s}.p2{left:82%;top:25%;animation-duration:11s}.p3{left:20%;top:48%;animation-duration:9s}.p4{left:88%;top:66%;animation-duration:10s}.p5{left:7%;top:83%;animation-duration:12s}
@keyframes float{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(22px,-35px) rotate(70deg)}100%{transform:translate(-8px,-75px) rotate(140deg);opacity:0}}
@media(max-width:500px){
  .page{max-width:none}
}
@media(prefers-reduced-motion:reduce){.petal{animation:none}}
</style>
</head>
<body>
<main class="page" aria-label="Experiencia del 30 de septiembre">
  <img class="art" src="mobile_storyboard.png" alt="Historia nocturna con un Datsun 240Z verde, un auto azul, flores azules y un regalo Hot Wheels">
  <div class="cover" aria-hidden="true">
    <span class="petal p1"></span><span class="petal p2"></span><span class="petal p3"></span>
    <span class="petal p4"></span><span class="petal p5"></span>
  </div>
  <a class="hotspot" id="start" href="#km1" aria-label="Encender motor"></a>
  <a class="hotspot" id="km1" href="#km2" aria-label="Kilómetro 1"></a>
  <a class="hotspot" id="km2" href="#km3" aria-label="Kilómetro 2"></a>
  <a class="hotspot" id="km3" href="#stop" aria-label="Kilómetro 3"></a>
  <a class="hotspot" id="stop" href="#gift" aria-label="Continuar"></a>
  <a class="hotspot" id="gift" href="#final" aria-label="Descubrir regalo"></a>
  <a class="hotspot" id="final" href="#top" aria-label="Volver a dar una vuelta"></a>
  <span id="top"></span>
</main>
<script>
document.querySelectorAll('.hotspot').forEach(a=>{
  a.addEventListener('click',e=>{
    const id=a.getAttribute('href');
    if(id && id!=='#top'){
      e.preventDefault();
      document.querySelector(id)?.scrollIntoView({behavior:'smooth',block:'center'});
    }else if(id==='#top'){
      e.preventDefault();
      window.scrollTo({top:0,behavior:'smooth'});
    }
  });
});
</script>
</body>
</html>
